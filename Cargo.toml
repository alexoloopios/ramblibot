[package]
name = "ramblibot"
version = "0.1.0"
edition = "2024"
description = "A small Windows controller for keeping a Ramblio hangout open"

[dependencies]
chromiumoxide = "0.9.1"
directories = "6"
futures = "0.3"
rungui = "0.4"
scraper = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
